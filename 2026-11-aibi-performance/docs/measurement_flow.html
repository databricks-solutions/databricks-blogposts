<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI/BI dashboard benchmark – measurement flow</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --lane: #f6f8fa; --lane2: #eef1f4; --border: #d0d7de;
    --node: #ffffff; --active: #2563eb; --active-bg: #e8f0fe; --dim: 0.28; --code-bg: #f6f8fa;
    --c-agent: #7c3aed; --c-shell: #0f766e; --c-chrome: #c2410c; --c-db: #b91c1c; --quiet: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --lane: #161b22; --lane2: #11161d; --border: #30363d;
      --node: #1c2128; --active: #60a5fa; --active-bg: #172a46; --code-bg: #161b22;
      --c-agent: #a78bfa; --c-shell: #2dd4bf; --c-chrome: #fb923c; --c-db: #f87171; --quiet: #64748b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 1340px; margin: 0 auto; padding: 20px 24px 40px; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .tabs button { border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0; background: none; padding: 7px 16px; font-weight: 600; color: var(--muted); margin-bottom: -1px; }
  .tabs button.on { border-color: var(--border); background: var(--bg); color: var(--fg); }
  .tab { display: none; } .tab.on { display: block; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  button { font: inherit; padding: 5px 12px; border: 1px solid var(--border); background: var(--node); color: var(--fg); border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--active); }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; }
  .steps button { padding: 4px 10px; font-size: 13px; }
  .steps button.on { background: var(--active); color: #fff; border-color: var(--active); }
  svg { width: 100%; height: auto; display: block; }
  .lane-bg { fill: var(--lane); } .lane-bg.alt { fill: var(--lane2); }
  .lane-label { font-size: 13px; font-weight: 600; }
  .lane-file { font-size: 11px; fill: var(--muted); }
  .node rect { fill: var(--node); stroke: var(--border); stroke-width: 1.2; rx: 8; transition: all .35s; }
  .node text { font-size: 12px; fill: var(--fg); transition: opacity .35s; }
  .node text.f { font-size: 10.5px; fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .node.on rect { stroke: var(--active); stroke-width: 2.4; fill: var(--active-bg); }
  .node.off { opacity: var(--dim); }
  .edge { fill: none; stroke: var(--border); stroke-width: 1.6; transition: all .35s; }
  .edge.on { stroke: var(--active); stroke-width: 2.4; }
  .edge.off { opacity: var(--dim); }
  .edge.loop { stroke-dasharray: 5 4; }
  .elabel { font-size: 11px; fill: var(--muted); transition: opacity .35s; }
  .elabel.on { fill: var(--active); font-weight: 600; }
  .elabel.off { opacity: var(--dim); }
  .dot { fill: var(--active); }
  .panel { display: grid; grid-template-columns: 1fr 1.25fr; gap: 18px; margin-top: 14px; }
  .card { min-width: 0; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card h2 { font-size: 16px; margin: 0 0 6px; }
  .card ul { margin: 6px 0 0 18px; padding: 0; } .card li { margin: 3px 0; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .files code { font-size: 12px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }
  .snip { margin: 0 0 10px; }
  .snip .hdr { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--active); margin-bottom: 2px; }
  pre { margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; overflow-x: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
  .tl-title { font-weight: 600; margin: 18px 0 4px; }
  .tl text { font-size: 11.5px; fill: var(--fg); }
  .tl .m { fill: var(--muted); }
  .tl .seg { transition: opacity .35s; }
  .tl .off { opacity: var(--dim); }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  @media (max-width: 900px) { .panel { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>How the benchmark was measured</h1>
  <div class="tabs" id="tabs"></div>
  <div id="tabroot"></div>
</main>

<script>

  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const NW = 160, NH = 64, LANE_H = 112;

// =====================================================================================================

    { id: "e5", a: "ch_load", b: "db_cache", label: "/lakeview-query/*", lx: 637, ly: 375 },

    { id: "e7", a: "ch_refresh", b: "db_bench", label: "/lakeview-query/*", lx: 837, ly: 375 },

      title: "1 · Invalidate the caches (before every single measurement)",

      bullets: [

  url: "https://<workspace>/dashboardsv3/<id>/published",

evaluate_script({ function: <contents of measure.js> })`],

      nodes: ["ch_load", "ch_refresh", "db_bench"], edges: ["e6", "e7"], tl: ["ref", "q2"], cursor: [0, 9.54],
      title: "3 · First load (cold) = Refresh click → last dashboard-query response",
      files: ["measure.js:8-19, 21-25, 28"],
      bullets: [
        "Once the page from step 2 has settled, the script finds the button whose <code>aria-label</code> starts with 'Refresh', notes <code>tClick = performance.now()</code> and clicks it.",

        ["measure.js:8-19", "  const isQ = e => e.name.includes('/lakeview-query/');\n  const settle = async (since) => {\n    const qs = () => performance.getEntriesByType('resource').filter(e => isQ(e) && e.startTime >= since);\n    let last = -1, stable = 0; const t0 = Date.now();\n    while (Date.now() - t0 < 240000) {\n      const n = qs().length;\n      if (n === last && n > 0) { stable += 500; if (stable >= 10000) break; } else { stable = 0; last = n; }\n      await new Promise(r => setTimeout(r, 500));\n    }\n    const es = qs();\n    return { n: es.length, end: Math.max(...es.map(e => e.responseEnd)) };\n  };"],

        ["measure.js:28", "    first_load_s: +((ref.end - tClick) / 1000).toFixed(2), n_requests_refresh: ref.n,"],

      nodes: ["ch_load", "db_cache"], edges: ["e5"], tl: ["t0", "nav", "q1", "quiet1"], cursor: [0, 2.84],

      ],
      code: [
        ["report.py:22-34", "def welch(a, b):\n    return (st.mean(a) - st.mean(b)) / math.sqrt(st.variance(a) / len(a) + st.variance(b) / len(b))\n\n\ndef delta(a, b):\n    return f\"{(st.mean(a) / st.mean(b) - 1) * 100:+.0f}% ({welch(a, b):+.1f})\"\n\n\nbrowser = collections.defaultdict(lambda: {\"first\": [], \"sub\": []})\nfor line in open(os.path.join(R, \"browser_runs.jsonl\")):\n    r = json.loads(line)\n    browser[r[\"variant\"]][\"first\"].append(r[\"first_load_s\"])\n    browser[r[\"variant\"]][\"sub\"].append(r[\"subsequent_load_s\"])"],

};

// =====================================================================================================
// Scenario 2: SQL replay benchmark
// =====================================================================================================
// per-query times of l0_baseline, first-load run 1 (results/replay_l0_baseline_pro.json, per_widget_s[*][0]); page = 9.17 s

function browserTimeline(tl) {
  // example numbers: l0_baseline run 1 (first 9.54 s, subsequent 2.84 s); quiet windows are 10 s each.
  // Each row has its own t = 0. In the script row ② (page navigation) runs before row ① (Refresh), see step 4.
  tl.setAttribute("viewBox", "0 0 1300 190");
  const X0 = 230, SCALE = 51, tx = (s) => X0 + s * SCALE;
  const FIRST = 9.54, SUB = 2.84, YA = 44, YB = 114;
  axis(tl, tx, 0, 20, 2, 166);
  const label = (y, a, b) => {
    const t = mk("text", { x: 14, y: y + 9, "font-weight": 600 }, tl); t.textContent = a;
    const u = mk("text", { x: 14, y: y + 25, class: "m" }, tl); u.textContent = b;
  };
  label(YA, "① First load (cold)", "t = 0: Refresh click (tClick)");
  label(YB, "② Subsequent load (cached)", "t = 0: navigation start");
  const els = {
    ref: seg(tl, tx(0), tx(FIRST), YA, 22, "var(--c-db)", "first_load_s = ref.end − tClick = 9.54 s"),
    q2: ticks(tl, tx, 0.4, FIRST, YA + 26),
    quiet2: seg(tl, tx(FIRST), tx(FIRST + 10), YA, 22, "var(--quiet)", "10 s quiet → return {…}", { opacity: 0.45, inside: true }),
    t0: seg(tl, tx(0) - 1, tx(0) + 2, YB - 6, 46, "var(--c-agent)", ""),
    nav: seg(tl, tx(0), tx(SUB), YB, 22, "var(--c-chrome)", "subsequent_load_s = nav.end = 2.84 s"),
    q1: ticks(tl, tx, 0.3, SUB, YB + 26),
    quiet1: seg(tl, tx(SUB), tx(SUB + 10), YB, 22, "var(--quiet)", "10 s quiet → settled, then the script clicks Refresh (row ①)", { opacity: 0.45, inside: true }),
  };
  mk("line", { x1: tx(0), y1: YA - 6, x2: tx(0), y2: YA + 40, stroke: "var(--c-agent)", "stroke-width": 3 }, els.ref);
  return { els, tx };
}

function replayTimeline(tl) {
  const ROW = 6.2, Y0 = 34, H = Y0 + REPLAY_RUN1.length * ROW;
  tl.setAttribute("viewBox", `0 0 1300 ${H + 92}`);
  const X0 = 250, SCALE = 100, tx = (s) => X0 + s * SCALE;
  axis(tl, tx, 0, 10, 1, H + 52);
  const els = {};
  els.conn = seg(tl, tx(-1.9), tx(-0.1), Y0, H - Y0, "var(--quiet)", "connect() × 28 – not timed", { opacity: 0.45 });
  els.t0 = seg(tl, tx(0) - 1, tx(0) + 2, Y0 - 16, H - Y0 + 22, "var(--c-agent)", "t0 = perf_counter()");
  const bars = mk("g", { class: "seg" }, tl);
  REPLAY_RUN1.forEach(([name, s], i) => {
    const flt = name.startsWith("flt_");
    mk("rect", { x: tx(0), y: Y0 + i * ROW, width: s * SCALE, height: ROW - 1.4, rx: 1.5,
      fill: flt ? "var(--c-shell)" : "var(--c-chrome)", opacity: 0.85 }, bars);
  });
  const lg = (x, color, txt) => { mk("rect", { x, y: H + 8, width: 10, height: 10, rx: 2, fill: color }, bars);
    const t = mk("text", { x: x + 14, y: H + 17 }, bars); t.textContent = txt; };
  lg(tx(0), "var(--c-shell)", "16 filter-dropdown queries (flt_*)");
  lg(tx(2.6), "var(--c-chrome)", "12 chart queries (w_*) – each bar = execute + fetchall in its own thread");
  els.bars = bars;
  els.page = seg(tl, tx(9.17) - 1, tx(9.17) + 2, Y0 - 16, H - Y0 + 22, "var(--c-db)", "");
  { const t = mk("text", { x: tx(9.17) - 4, y: Y0 - 20, "text-anchor": "end" }, els.page); t.textContent = "pool done → first_load = 9.17 s (slowest: w_delta_py 8.95 s)"; }
  els.sub = seg(tl, tx(0), tx(2.42), H + 26, 10, "var(--c-agent)", "");
  { const t = mk("text", { x: tx(2.42) + 6, y: H + 35 }, els.sub); t.textContent = "subsequent run 1 (result cache on): 2.42 s"; }
  return { els, tx };
}

function axis(tl, tx, from, to, step, y) {
  mk("line", { x1: tx(from), y1: y, x2: tx(to) + 10, y2: y, stroke: "var(--border)" }, tl);
  for (let s = from; s <= to; s += step) {
    mk("line", { x1: tx(s), y1: y, x2: tx(s), y2: y + 5, stroke: "var(--border)" }, tl);
    const t = mk("text", { x: tx(s), y: y + 18, "text-anchor": "middle", class: "m" }, tl); t.textContent = s + " s";
  }
}
function seg(tl, x1, x2, y, h, fill, label, extra = {}) {
  const g = mk("g", { class: "seg" }, tl);
  mk("rect", { x: x1, y, width: Math.max(2, x2 - x1), height: h, rx: 4, fill, opacity: extra.opacity ?? 1 }, g);
  if (label && extra.inside) { const t = mk("text", { x: x1 + 6, y: y + 15 }, g); t.textContent = label; }
  else if (label) { const t = mk("text", { x: x1 + 4, y: y - 5 }, g); t.textContent = label; }
  return g;
}
function ticks(tl, tx, from, to, y) { // request completions, denser at the start
  const g = mk("g", { class: "seg" }, tl);
  for (let i = 0; i < 18; i++) { const s = from + (to - from) * Math.pow(i / 17, 0.8);
    mk("line", { x1: tx(s), y1: y, x2: tx(s), y2: y + 10, stroke: "var(--fg)", "stroke-width": 1, opacity: 0.6 }, g); }
  return g;
}

function drawFlow(S, flow) {
  const laneY = Object.fromEntries(S.lanes.map((l, i) => [l.id, LANE_Y[i]]));
  const laneMid = (l) => laneY[l] + LANE_H / 2;
  const cx = (n) => S.nodes[n].x, cy = (n) => laneMid(S.nodes[n].lane);

  function edgePath(e) {
    const ax = cx(e.a), ay = cy(e.a), bx = cx(e.b), by = cy(e.b);
    if (e.loopY !== undefined) return `M ${ax} ${ay - NH / 2} V ${e.loopY} H ${bx} V ${by - NH / 2}`;
    if (ay === by) { const s = Math.sign(bx - ax); return `M ${ax + s * NW / 2} ${ay} H ${bx - s * NW / 2}`; }
    const s = Math.sign(by - ay);
    if (ax === bx) return `M ${ax} ${ay + s * NH / 2} V ${by - s * NH / 2}`;
    return `M ${ax} ${ay + s * NH / 2} V ${by} H ${bx - Math.sign(bx - ax) * NW / 2}`;
  }

  S.lanes.forEach((l, i) => {
    mk("rect", { x: 0, y: laneY[l.id], width: 1300, height: LANE_H, class: "lane-bg" + (i % 2 ? " alt" : ""), rx: 6 }, flow);
    mk("rect", { x: 0, y: laneY[l.id], width: 5, height: LANE_H, fill: `var(${l.color})`, rx: 2 }, flow);
    const t = mk("text", { x: 16, y: laneMid(l.id) - 4, class: "lane-label", fill: `var(${l.color})` }, flow); t.textContent = l.label;
    const f = mk("text", { x: 16, y: laneMid(l.id) + 13, class: "lane-file" }, flow); f.textContent = l.file;
  });
  const defs = mk("defs", {}, flow);
  const marker = mk("marker", { id: `arr-${S.id}`, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
  mk("path", { d: "M0,0 L10,5 L0,10 z", fill: "var(--muted)" }, marker);
  const edgeEls = {}, labelEls = {}, nodeEls = {};
  S.edges.forEach((e) => {
    edgeEls[e.id] = mk("path", { d: edgePath(e), class: "edge" + (e.loopY !== undefined ? " loop" : ""), "marker-end": `url(#arr-${S.id})` }, flow);
    if (e.label) { const t = mk("text", { x: e.lx, y: e.ly, class: "elabel" }, flow); t.textContent = e.label; labelEls[e.id] = t; }
  });
  for (const [id, n] of Object.entries(S.nodes)) {
    const g = mk("g", { class: "node" }, flow);
    const x = n.x - NW / 2, y = laneMid(n.lane) - NH / 2;
    mk("rect", { x, y, width: NW, height: NH, rx: 8 }, g);
    n.t.forEach((line, i) => { const t = mk("text", { x: n.x, y: y + 20 + i * 15, "text-anchor": "middle" }, g); t.textContent = line; });
    const f = mk("text", { x: n.x, y: y + NH - 9, "text-anchor": "middle", class: "f" }, g); f.textContent = n.f;
    nodeEls[id] = g;
  }
  const dot = mk("circle", { r: 6, class: "dot", opacity: 0 }, flow);
  return { nodeEls, edgeEls, labelEls, dot, edgePath };

}

// =====================================================================================================
// generic flow engine (one instance per tab)
// =====================================================================================================
function Flow(S, root) {
  root.innerHTML = `<p class="sub">${S.intro}</p>
    <div class="controls"><button class="play">❚❚ Pause</button><button class="prev">◀ Prev</button><button class="next">Next ▶</button><div class="steps"></div></div>
    <svg class="flow" viewBox="0 0 1300 520" role="img"></svg>
    <div class="tl-title">${S.tlTitle}</div><svg class="tl" role="img"></svg>
    <div class="panel"><div class="card what"></div><div class="card code"></div></div>
    <p class="note">${S.note}</p>`;
  const q = (c) => root.querySelector(c);
  const flow = q(".flow"), stepBar = q(".steps");
  const { nodeEls, edgeEls, labelEls, dot } = drawFlow(S, flow);

  const tl = q(".tl"), T = S.timeline(tl);
  const cursor = mk("line", { y1: 14, y2: tl.viewBox.baseVal.height - 30, stroke: "var(--active)", "stroke-width": 2, opacity: 0 }, tl);

  let cur = 0, playing = true, timer = null, raf = null, active = false;
  S.steps.forEach((s, i) => { const b = document.createElement("button"); b.textContent = s.name; b.onclick = () => go(i, true); stepBar.appendChild(b); });

  function render(i) {
    const s = S.steps[i];
    [...stepBar.children].forEach((b, j) => b.classList.toggle("on", j === i));
    for (const [id, g] of Object.entries(nodeEls)) { g.classList.toggle("on", s.nodes.includes(id)); g.classList.toggle("off", !s.nodes.includes(id)); }
    for (const [id, p] of Object.entries(edgeEls)) {
      const on = s.edges.includes(id); p.classList.toggle("on", on); p.classList.toggle("off", !on);
      if (labelEls[id]) { labelEls[id].classList.toggle("on", on); labelEls[id].classList.toggle("off", !on); }
    }
    for (const [k, g] of Object.entries(T.els)) g.classList.toggle("off", s.tl.length > 0 && !s.tl.includes(k));
    q(".what").innerHTML = `<h2>${s.title}</h2><div class="files">${s.files.map(f => `<code>${f}</code>`).join("")}</div>` +
      `<ul>${s.bullets.map(b => `<li>${b}</li>`).join("")}</ul>`;
    const code = q(".code"); code.innerHTML = "";
    s.code.forEach(([hdr, src]) => {
      const d = document.createElement("div"); d.className = "snip";
      const h = document.createElement("div"); h.className = "hdr"; h.textContent = hdr;
      const p = document.createElement("pre"); p.textContent = src;
      d.append(h, p); code.appendChild(d);
    });
    animate(s);
  }

  function animate(s) {
    cancelAnimationFrame(raf);
    if (!active) return;
    const paths = s.edges.map(id => edgeEls[id]), PER = 1300, t0 = performance.now();
    cursor.setAttribute("opacity", s.cursor ? 1 : 0);
    const frame = (now) => {
      const el = now - t0, k = Math.floor(el / PER) % Math.max(1, paths.length), f = (el % PER) / PER;
      if (paths.length) {
        const p = paths[k], pt = p.getPointAtLength(p.getTotalLength() * f);
        dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y); dot.setAttribute("opacity", 1);
      } else dot.setAttribute("opacity", 0);
      if (s.cursor) {
        const total = PER * Math.max(1, paths.length), g = (el % total) / total;
        const x = T.tx(s.cursor[0] + (s.cursor[1] - s.cursor[0]) * g);
        cursor.setAttribute("x1", x); cursor.setAttribute("x2", x);
      }
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  }

  function go(i, manual) {
    cur = (i + S.steps.length) % S.steps.length;
    render(cur);
    if (manual) setPlaying(false); else schedule();
  }
  function schedule() { clearTimeout(timer); if (playing && active) timer = setTimeout(() => go(cur + 1), 7000); }
  function setPlaying(p) { playing = p; q(".play").textContent = p ? "❚❚ Pause" : "▶ Play"; schedule(); }
  q(".play").onclick = () => setPlaying(!playing);
  q(".prev").onclick = () => go(cur - 1, true);
  q(".next").onclick = () => go(cur + 1, true);

  return {
    show(on) { active = on; root.classList.toggle("on", on); if (on) go(cur); else { clearTimeout(timer); cancelAnimationFrame(raf); } },
    key(e) {
      if (e.key === "ArrowRight") go(cur + 1, true);
      if (e.key === "ArrowLeft") go(cur - 1, true);
      if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
    },
  };
}

// =====================================================================================================
// static export: one self-animating SVG per scenario (SMIL, no JS - renders in a GitHub README <img>)
// open the page with #export-browser / #export-replay; the SVG source is put into <script id="svg-out">
// =====================================================================================================
const STATIC_CSS = `
  .bg { fill: #ffffff; } .fg { fill: #1f2328; } .mut { fill: #656d76; }
  svg { --fg: #1f2328; --muted: #656d76; --lane: #f6f8fa; --lane2: #eef1f4; --border: #d0d7de; --node: #ffffff;
        --active: #2563eb; --active-bg: #e8f0fe; --quiet: #94a3b8;
        --c-agent: #7c3aed; --c-shell: #0f766e; --c-chrome: #c2410c; --c-db: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; } .fg { fill: #e6edf3; } .mut { fill: #8d96a0; }
    svg { --fg: #e6edf3; --muted: #8d96a0; --lane: #161b22; --lane2: #11161d; --border: #30363d; --node: #1c2128;
          --active: #60a5fa; --active-bg: #172a46; --quiet: #64748b;
          --c-agent: #a78bfa; --c-shell: #2dd4bf; --c-chrome: #fb923c; --c-db: #f87171; }
  }
  svg { fill: var(--fg); }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono, .node text.f { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .lane-bg { fill: var(--lane); } .lane-bg.alt { fill: var(--lane2); }
  .lane-label { font-size: 13px; font-weight: 600; } .lane-file { font-size: 11px; fill: var(--muted); }
  .node rect { fill: var(--node); stroke: var(--border); stroke-width: 1.2; }
  .node rect.hl { fill: var(--active-bg); stroke: var(--active); stroke-width: 2.4; }
  .node text { font-size: 12px; } .node text.f { font-size: 10.5px; fill: var(--muted); }
  .edge { fill: none; stroke: var(--border); stroke-width: 1.6; } .edge.loop { stroke-dasharray: 5 4; }
  .edge.hl { stroke: var(--active); stroke-width: 2.4; }
  .elabel { font-size: 11px; fill: var(--muted); }
  .dot { fill: var(--active); }
  .chip rect { fill: var(--node); stroke: var(--border); } .chip rect.hl { fill: var(--active); stroke: var(--active); }
  .chip text { font-size: 12.5px; } .chip text.hl { fill: #ffffff; }
  .cap-title { font-size: 15px; font-weight: 600; } .cap { font-size: 12.5px; }
  .tl text { font-size: 11.5px; } .tl .m { fill: var(--muted); }`;

function staticSVG(S, D = 6) {
  const K = S.steps.length, DUR = `${K * D}s`, DIM = 0.25, W = 1300;
  const keyTimes = S.steps.map((_, i) => (i / K).toFixed(4)).join(";");
  const anim = (el, onAt, on = 1, off = DIM) =>
    mk("animate", { attributeName: "opacity", values: S.steps.map((s, i) => (onAt(s, i) ? on : off)).join(";"),
      keyTimes, calcMode: "discrete", dur: DUR, repeatCount: "indefinite" }, el);

  const svg = mk("svg", { xmlns: NS, width: W });
  mk("style", {}, svg).textContent = STATIC_CSS;
  const bg = mk("rect", { x: 0, y: 0, width: W, class: "bg", rx: 10 }, svg);

  // step chips
  let cx0 = 12;
  S.steps.forEach((s, i) => {
    const w = 18 + s.name.length * 7.1, g = mk("g", { class: "chip" }, svg);
    mk("rect", { x: cx0, y: 10, width: w, height: 26, rx: 6 }, g);
    anim(mk("rect", { x: cx0, y: 10, width: w, height: 26, rx: 6, class: "hl" }, g), (_, j) => j === i, 1, 0);
    const t = mk("text", { x: cx0 + w / 2, y: 27.5, "text-anchor": "middle" }, g); t.textContent = s.name;
    const th = mk("text", { x: cx0 + w / 2, y: 27.5, "text-anchor": "middle", class: "hl" }, g); th.textContent = s.name;
    anim(th, (_, j) => j === i, 1, 0);
    cx0 += w + 6;
  });

  // flow
  const flow = mk("g", { transform: "translate(0 44)" }, svg); // plain groups: nested <svg> elements would get their own SMIL clock
  const F = drawFlow(S, flow);
  for (const [id, g] of Object.entries(F.nodeEls)) {
    const base = g.querySelector("rect"), hl = base.cloneNode(); hl.setAttribute("class", "hl");
    base.after(hl);
    anim(hl, (s) => s.nodes.includes(id), 1, 0);
    anim(g, (s) => s.nodes.includes(id));
  }
  for (const [id, p] of Object.entries(F.edgeEls)) {
    const hl = p.cloneNode(); hl.setAttribute("class", p.getAttribute("class") + " hl"); p.after(hl);
    anim(hl, (s) => s.edges.includes(id), 1, 0);
    anim(p, (s) => s.edges.includes(id));
    if (F.labelEls[id]) anim(F.labelEls[id], (s) => s.edges.includes(id));
  }
  F.dot.remove();
  S.steps.forEach((s, i) => {
    if (!s.edges.length) return;
    const d = s.edges.map((id) => F.edgeEls[id].getAttribute("d")).join(" ");
    const c = mk("circle", { r: 6, class: "dot" }, flow);
    anim(c, (_, j) => j === i, 1, 0);
    mk("animateMotion", { path: d, dur: `${D}s`, repeatCount: "indefinite" }, c);
  });

  // caption per step
  const CY = 44 + 520 + 14;
  S.steps.forEach((s, i) => {
    const g = mk("g", {}, svg);
    anim(g, (_, j) => j === i, 1, 0);
    const t = mk("text", { x: 14, y: CY + 16, class: "cap-title" }, g); t.textContent = s.title;
    const f = mk("text", { x: 14, y: CY + 36, class: "cap mono mut" }, g); f.textContent = s.files.join("  ·  ");
    (s.cap || []).forEach((line, k) => { const c = mk("text", { x: 14, y: CY + 58 + k * 18, class: "cap" }, g); c.textContent = line; });
  });

  // timeline
  const TY = CY + 110;
  const tt = mk("text", { x: 14, y: TY + 12, class: "cap-title" }, svg);
  tt.textContent = S.tlTitle.replace(/<[^>]+>/g, "");
  const tl = mk("g", { transform: `translate(0 ${TY + 22})`, class: "tl" }, svg);
  const T = S.timeline(tl), vb = { height: +tl.getAttribute("viewBox").split(" ")[3] };
  tl.removeAttribute("viewBox");
  for (const [k, g] of Object.entries(T.els)) anim(g, (s) => !s.tl.length || s.tl.includes(k));
  S.steps.forEach((s, i) => {
    if (!s.cursor) return;
    const ln = mk("line", { y1: 14, y2: vb.height - 30, stroke: "var(--active)", "stroke-width": 2 }, tl);
    anim(ln, (_, j) => j === i, 1, 0);
    for (const a of ["x1", "x2"]) mk("animate", { attributeName: a, from: T.tx(s.cursor[0]), to: T.tx(s.cursor[1]), dur: `${D}s`, repeatCount: "indefinite" }, ln);
  });

  const H = Math.ceil(TY + 22 + vb.height + 8);
  svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); bg.setAttribute("height", H);
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svg) + "\n";
}

// =====================================================================================================
// tabs
// =====================================================================================================
const flows = [BROWSER, REPLAY].map((S) => {
  const root = document.createElement("div"); root.className = "tab"; root.id = `tab-${S.id}`;
  document.getElementById("tabroot").appendChild(root);
  const b = document.createElement("button"); b.textContent = S.tab; document.getElementById("tabs").appendChild(b);
  return { S, root, b, f: Flow(S, root) };
});
let activeFlow = null;
function showTab(id) {
  flows.forEach((x) => { const on = x.S.id === id; x.b.classList.toggle("on", on); x.f.show(on); if (on) activeFlow = x.f; });
  history.replaceState(null, "", `#${id}`);
}
flows.forEach((x) => (x.b.onclick = () => showTab(x.S.id)));
document.addEventListener("keydown", (e) => activeFlow && activeFlow.key(e));
const exp = location.hash.match(/^#export-(\w+)$/);
if (exp) {
  const S = [BROWSER, REPLAY].find((x) => x.id === exp[1]);
  const scratch = document.createElementNS(NS, "svg"); document.body.appendChild(scratch); // getTotalLength etc. need a live DOM
  const src = staticSVG(S);
  const out = document.createElement("script"); out.type = "text/plain"; out.id = "svg-out"; out.textContent = src;
  document.body.appendChild(out);
} else {
  showTab(location.hash === "#replay" ? "replay" : "browser");
}
</script>
</body>
</html>

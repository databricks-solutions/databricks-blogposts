resources:
  jobs:
    batch_inference_job:
      name: "LLMOps Quickstart - 3. Batch Inference [${var.environment}]"
      description: "Runs the Champion model over all support tickets and writes predictions to a results table."

      environments:
        - environment_key: default
          spec:
            environment_version: "5"

      parameters:
        - name: catalog_name
          default: "${var.catalog_name}"
        - name: schema_name
          default: "${var.schema_name}"
        - name: model_name
          default: "${var.model_name}"

      tasks:
        - task_key: batch_inference
          environment_key: default
          notebook_task:
            notebook_path: "../notebooks/3_inference/batch_inference.py"
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name: "{{job.parameters.schema_name}}"
              model_name: "{{job.parameters.model_name}}"

      timeout_seconds: 3600
      max_concurrent_runs: 1
      tags:
        Project: llmops-quickstart
        Environment: "${var.environment}"

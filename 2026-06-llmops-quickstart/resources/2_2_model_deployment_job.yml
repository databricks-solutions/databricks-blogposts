resources:
  jobs:
    model_deployment_job:
      name: "LLMOps Quickstart - 2.2 Model Approval & Deployment [${var.environment}]"
      description: "Promotes the approved Challenger to Champion, then deploys Champion to a Mosaic AI Model Serving endpoint with Unity AI Gateway governance."

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - "databricks-openai"

      parameters:
        - name: catalog_name
          default: "${var.catalog_name}"
        - name: schema_name
          default: "${var.schema_name}"
        - name: model_name
          default: "${var.model_name}"
        - name: experiment_name
          default: "${resources.experiments.llmops_experiment.name}"
        # Human-in-the-loop gate. Deployment does nothing until a Challenger has been
        # approved into Champion. Run with: --params approved=true
        - name: approved
          default: "false"

      tasks:
        - task_key: model_approval
          environment_key: default
          notebook_task:
            notebook_path: "../notebooks/2_model_build_and_deploy/model_approval.py"
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name: "{{job.parameters.schema_name}}"
              model_name: "{{job.parameters.model_name}}"
              approved: "{{job.parameters.approved}}"

        - task_key: model_deployment
          depends_on:
            - task_key: model_approval
          environment_key: default
          notebook_task:
            notebook_path: "../notebooks/2_model_build_and_deploy/model_deployment.py"
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name: "{{job.parameters.schema_name}}"
              model_name: "{{job.parameters.model_name}}"
              experiment_name: "{{job.parameters.experiment_name}}"

      timeout_seconds: 3600
      max_concurrent_runs: 1
      tags:
        Project: llmops-quickstart
        Environment: "${var.environment}"

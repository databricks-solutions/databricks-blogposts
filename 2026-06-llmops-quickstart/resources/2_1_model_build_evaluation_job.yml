resources:
  jobs:
    model_build_evaluation_job:
      name: "LLMOps Quickstart - 2.1 Model Build & Evaluation [${var.environment}]"
      description: "Logs the agent to MLflow, evaluates it, and promotes to Champion if the accuracy threshold is met."

      # databricks-agents, mlflow, databricks-sdk, and pydantic are all included in Env v5.
      # Only databricks-openai needs to be added.
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - "databricks-openai"

      parameters:
        - name: catalog_name
          default: "${var.catalog_name}"
        - name: schema_name
          default: "${var.schema_name}"
        - name: model_name
          default: "${var.model_name}"
        - name: llm_endpoint
          default: "${var.llm_endpoint}"
        - name: experiment_name
          default: "${resources.experiments.llmops_experiment.name}"
        - name: accuracy_threshold
          default: "0.8"

      tasks:
        - task_key: model_build
          environment_key: default
          notebook_task:
            notebook_path: "../notebooks/2_model_build_and_deploy/model_build.py"
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name: "{{job.parameters.schema_name}}"
              model_name: "{{job.parameters.model_name}}"
              llm_endpoint: "{{job.parameters.llm_endpoint}}"
              experiment_name: "{{job.parameters.experiment_name}}"

        - task_key: model_evaluation
          depends_on:
            - task_key: model_build
          environment_key: default
          notebook_task:
            notebook_path: "../notebooks/2_model_build_and_deploy/model_evaluation.py"
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name: "{{job.parameters.schema_name}}"
              model_name: "{{job.parameters.model_name}}"
              experiment_name: "{{job.parameters.experiment_name}}"
              logged_run_id: "{{tasks.model_build.values.logged_run_id}}"
              accuracy_threshold: "{{job.parameters.accuracy_threshold}}"

      timeout_seconds: 3600
      max_concurrent_runs: 1
      tags:
        Project: llmops-quickstart
        Environment: "${var.environment}"

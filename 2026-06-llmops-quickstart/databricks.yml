bundle:
  name: llmops-quickstart

include:
  - resources/*.yml

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

variables:
  catalog_name:
    description: "Unity Catalog catalog name (must already exist)"
    default: main
  schema_name:
    description: "Unity Catalog schema name (created by the bundle if absent)"
    default: llmops_quickstart
  model_name:
    description: "Registered model name in Unity Catalog"
    default: support_ticket_classifier
  llm_endpoint:
    # Any Databricks Foundation Model API endpoint works. Good 2026 options:
    #   databricks-claude-sonnet-5    (default — most capable)
    #   databricks-claude-sonnet-4-6  (solid, lower cost)
    #   databricks-claude-haiku-4-5   (cheapest/fastest; may miss the accuracy gate on this task)
    description: "Databricks Foundation Model API endpoint used by the agent"
    default: databricks-claude-sonnet-5
  environment:
    description: "Deployment environment label"
    default: dev

targets:
  dev:
    mode: development
    default: true
    variables:
      environment: dev

  prod:
    mode: production
    variables:
      schema_name: llmops_quickstart_prod
      environment: prod

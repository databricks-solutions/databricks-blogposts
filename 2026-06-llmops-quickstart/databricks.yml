bundle:
  name: llmops-quickstart

include:
  - resources/*.yml

variables:
  catalog_name:
    description: "Unity Catalog catalog name (must already exist)"
    default: main
  schema_name:
    description: "Unity Catalog schema name (created by the bundle if absent)"
    default: llmops_quickstart
  llm_model:
    # Fully-qualified name of the UAIG model service the agent calls, e.g.
    #   <catalog>.default.claude-sonnet-5   (most capable)
    #   <catalog>.default.gpt-oss-120b      (open model)
    # Create the model service once in the AI Gateway UI (code creation isn't
    # available during the beta), then set this to its fully-qualified name.
    description: "Fully-qualified name of the UAIG model service the agent calls"
    default: main.default.claude-sonnet-5
  environment:
    description: "Deployment environment label"
    default: dev
  prod_service_principal:
    # Application ID (or username) of the identity that deploys the prod target.
    # Pins the prod bundle root to one fixed, restricted location so the deploy
    # does not follow whoever happens to run it. Override with
    #   --var="prod_service_principal=<your-sp-application-id>"
    description: "Identity that runs the prod deploy"
    default: ""

resources:
  apps:
    ticket_classifier:
      # Suffixed with the target so dev and prod can coexist in one workspace
      # (development mode does not prefix app names the way it does jobs).
      name: "llmops-quickstart-classifier-${bundle.target}"
      description: "Support ticket classifier agent (LLMOps Quickstart)"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-server"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: LLM_MODEL
            value: "${var.llm_model}"
      resources:
        - name: "experiment"
          experiment:
            experiment_id: "${resources.experiments.llmops_experiment.id}"
            permission: "CAN_MANAGE"

  experiments:
    llmops_experiment:
      name: "/Users/${workspace.current_user.userName}/${bundle.target}_llmops_quickstart"

targets:
  dev:
    mode: development
    default: true
    variables:
      environment: dev

  prod:
    mode: production
    # Pin prod to one fixed location so the deploy lands in the same place
    # regardless of who runs it, instead of following the deployer's home folder.
    # Point this at the identity your CI deploys as. Keep it under /Workspace/Users
    # rather than /Workspace/Shared, which would be writable by all workspace users.
    # (Apps require run_as to match the owner, so the deploying identity owns the app.)
    workspace:
      root_path: /Workspace/Users/${var.prod_service_principal}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema_name: llmops_quickstart_prod
      environment: prod

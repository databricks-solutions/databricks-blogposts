# PySpark RTM SparkApplication — p6 (7 cores / 14 GB), on the Spark 4.3.0 APT image
# with async-progress-tracking (SPARK-58131, __APT__). Resources IDENTICAL to the stock p6/pyspark-rtm.yaml.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: rtm-bench
  namespace: spark
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "__REGISTRY__/rtm-bench/spark-pr:__TAG__"
  imagePullPolicy: Always
  mainApplicationFile: "local:///opt/spark/work-dir/rtm_pyspark_measured.py"
  sparkVersion: "4.3.0"
  sparkConf:
    spark.sql.adaptive.enabled: "false"
    spark.sql.shuffle.partitions: "6"
    spark.hadoop.fs.s3a.aws.credentials.provider: "software.amazon.awssdk.auth.credentials.WebIdentityTokenFileCredentialsProvider"
    spark.sql.streaming.realTimeMode.asyncProgressTrackingByDefault.enabled: "__APT__"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 5
    onFailureRetryInterval: 5
    onSubmissionFailureRetries: 3
    onSubmissionFailureRetryInterval: 5
  # Pod-total memory matched EXACTLY to Flink's JM/TM pods (see spark-rtm-pr.yaml).
  driver:
    cores: 1
    memory: "1536m"
    memoryOverhead: "512m"     # 2048m pod, = Flink JobManager
    serviceAccount: spark-operator-spark
    env:
      - { name: KAFKA_BOOTSTRAP_INTERNAL, value: "bench-kafka-bootstrap.kafka.svc:9092" }
      - { name: INPUT_TOPIC, value: "input-events" }
      - { name: OUTPUT_TOPIC, value: "output-events" }
      - { name: RTM_TRIGGER, value: "60 seconds" }
      - { name: CHECKPOINT_LOCATION, value: "s3a://rtm-flink-bench-ckpt-__ACCOUNT__/__CKPTNAME__" }
  executor:
    instances: 2
    cores: 3
    memory: "5120m"
    memoryOverhead: "1024m"    # 6144m pod, = Flink TaskManager
